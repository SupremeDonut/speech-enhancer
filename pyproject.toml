[project]
name = "speech-isolation-training"
version = "0.1.0"
description = "Data preparation and float PyTorch training for streaming speech enhancement"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.3.5",
    "scipy==1.15.1",
    "soundfile==0.12.1",
    "torch==2.12.0",
    "tqdm==4.67.1",
    "onnx==1.19.0",
    "onnxruntime==1.22.1",
]

[dependency-groups]
dev = ["pytest==8.3.4"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
